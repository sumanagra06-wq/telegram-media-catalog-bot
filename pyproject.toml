[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-media-catalog-bot"
version = "0.1.0"
description = "Private Telegram media catalog with Telegram-backed snapshots"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.14.3,<4",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "bandit>=1.8,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
